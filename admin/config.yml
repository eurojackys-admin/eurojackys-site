backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

locale: 'fr'

collections:
  - name: "articles"
    label: "📰 Articles / Récaps"
    label_singular: "Article"
    folder: "articles"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Catégorie"
        name: "category"
        widget: "select"
        default: "news"
        options:
          - { label: "Actualités", value: "news" }
          - { label: "Analyses", value: "analysis" }
          - { label: "Guides", value: "guides" }
          - { label: "Archives", value: "archives" }
      - { label: "Titre (FR)", name: "title", widget: "string" }
      - { label: "Titre (EN)", name: "title_en", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "cover", widget: "image", required: false }
      - { label: "Résumé court (FR)", name: "summary", widget: "text", required: false }
      - { label: "Résumé court (EN)", name: "summary_en", widget: "text", required: false }
      - { label: "Contenu (FR)", name: "body", widget: "markdown" }
      - { label: "Contenu (EN)", name: "body_en", widget: "markdown", required: false }
      - { label: "Lien externe (Instagram, TikTok, X...)", name: "external_link", widget: "string", required: false }

  - name: "calendar"
    label: "📅 Calendrier"
    label_singular: "Événement"
    folder: "content/calendar"
    create: true
    delete: true
    extension: "yml"
    format: "yaml"
    identifier_field: "title_fr"
    slug: "{{slug}}"
    summary: "{{date_display}} — {{title_fr}}"
    fields:
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1 }
      - { label: "Date affichée (ex: 18.07.2026 ou 'À confirmer')", name: "date_display", widget: "string" }
      - { label: "Titre (FR)", name: "title_fr", widget: "string" }
      - { label: "Titre (EN)", name: "title_en", widget: "string" }
      - { label: "Description (FR)", name: "desc_fr", widget: "string", required: false }
      - { label: "Description (EN)", name: "desc_en", widget: "string", required: false }
      - { label: "Étiquette (FR) — ex: Cette semaine, Annuel", name: "tag_fr", widget: "string", required: false }
      - { label: "Étiquette (EN) — ex: This week, Annual", name: "tag_en", widget: "string", required: false }

  - name: "projects"
    label: "⭐ Projets / Formats"
    label_singular: "Projet"
    folder: "content/projects"
    create: true
    delete: true
    extension: "yml"
    format: "yaml"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1 }
      - { label: "Emoji / icône (ex: 🔮)", name: "icon", widget: "string", default: "✨" }
      - { label: "Nom du projet", name: "title", widget: "string" }
      - { label: "Fréquence (FR)", name: "freq_fr", widget: "string", required: false }
      - { label: "Fréquence (EN)", name: "freq_en", widget: "string", required: false }
      - { label: "Description (FR)", name: "desc_fr", widget: "text" }
      - { label: "Description (EN)", name: "desc_en", widget: "text" }
      - { label: "Lien (optionnel)", name: "link", widget: "string", required: false }

  - name: "gallery"
    label: "🖼️ Galerie photos"
    label_singular: "Photo"
    folder: "content/gallery"
    create: true
    delete: true
    extension: "yml"
    format: "yaml"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1 }
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Sous-titre (FR)", name: "subtitle_fr", widget: "string", required: false }
      - { label: "Sous-titre (EN)", name: "subtitle_en", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Lien (optionnel)", name: "link", widget: "string", required: false }

  - name: "map"
    label: "🗺️ Carte des pays"
    label_singular: "Pays"
    folder: "content/map"
    create: true
    delete: true
    extension: "yml"
    format: "yaml"
    identifier_field: "country"
    slug: "{{slug}}"
    summary: "{{country}}"
    fields:
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1 }
      - label: "Pays sur la carte"
        name: "country_code"
        widget: "select"
